<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>subAnimJ Preview</title>
<style>
body {
  font-family: sans-serif;
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}
h1 { text-align: center; }
.container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 16px;
}
.kanji {
  text-align: center;
}
.kanji h2 {
  margin: 0 0 4px 0;
  font-size: 1.2em;
}
.kanji object {
  width: 200px;
  height: 200px;
  border: 1px solid #eee;
}
button {
  display: block;
  margin: 20px auto;
  padding: 8px 24px;
  font-size: 1em;
  cursor: pointer;
}
</style>
</head>
<body>
<h1>subAnimJ Preview</h1>
<button onclick="replay()">Replay</button>
<div class="container" id="container"></div>
<script>
const items = [
  { char: "日", file: "svgsJa/26085.svg" },
  { char: "早", file: "svgsJa/26089.svg" },
  { char: "月", file: "svgsJa/26376.svg" },
  { char: "田", file: "svgsJa/30000.svg" },
  { char: "町", file: "svgsJa/30010.svg" },
  { char: "白", file: "svgsJa/30333.svg" },
  { char: "百", file: "svgsJa/30334.svg" },
  { char: "目", file: "svgsJa/30446.svg" },
  { char: "組", file: "svgsJa/32068.svg" },
  { char: "耳", file: "svgsJa/32819.svg" },
  { char: "草", file: "svgsJa/33609.svg" },
  { char: "見", file: "svgsJa/35211.svg" },
  { char: "貝", file: "svgsJa/35997.svg" },
  { char: "車", file: "svgsJa/36554.svg" },
  { char: "青", file: "svgsJa/38738.svg" },
];
const container = document.getElementById('container');
function loadAll() {
  container.innerHTML = '';
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'kanji';
    const h2 = document.createElement('h2');
    h2.textContent = it.char;
    div.appendChild(h2);
    const obj = document.createElement('object');
    obj.type = 'image/svg+xml';
    obj.data = it.file + '?t=' + Date.now();
    div.appendChild(obj);
    container.appendChild(div);
  });
}
function replay() { loadAll(); }
loadAll();
</script>
</body>
</html>
